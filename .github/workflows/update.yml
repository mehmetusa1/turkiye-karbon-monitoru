name: Saatlik Veri Güncelleme

on:
  schedule:
    # Saatte üç deneme (7, 27, 47. dakika). GitHub zamanlanmış çalışmaları garanti etmez,
    # sık sık atlar; tek deneme yerine üç deneme verinin saatlerce eskimesini önler.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      backfill_year:
        description: "Son 1 yılın geçmiş verisini çek (--backfill-year)"
        required: false
        default: false
        type: boolean

# Saatlik çalışma ile elle başlatılan backfill üst üste binip push çakışması yaratmasın
concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu indir
        # v4.2.2 — etiket yerine commit SHA'sı ile sabitlendi
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Yazma yetkili token .git/config içine yazılmasın; yalnızca push adımında kullanılır
          persist-credentials: false

      - name: Python kur
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: EPİAŞ verisini çek ve türetilmiş özetleri güncelle
        env:
          EPTR_USERNAME: ${{ secrets.EPTR_USERNAME }}
          EPTR_PASSWORD: ${{ secrets.EPTR_PASSWORD }}
          BACKFILL_YEAR: ${{ inputs.backfill_year }}
        run: |
          if [ "$BACKFILL_YEAR" = "true" ]; then
            python scripts/update_data.py --backfill-year
          else
            python scripts/update_data.py
          fi

      - name: Güvenlik ve veri sızıntısı testlerini çalıştır
        run: pytest

      - name: Türetilmiş JSON dosyalarını kaydet ve gönder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "Veride değişiklik yok."
          else
            git commit -m "chore(data): saatlik türetilmiş karbon yoğunluğu güncellemesi"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
